# Cuts a downloadable release. Push a version tag and this builds, tests, and attaches a
# self-contained UmaCompanion.exe to a GitHub Release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Can also be run from the Actions tab (workflow_dispatch) to rehearse a build without tagging;
# that path publishes the artifact to the run instead of creating a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  build:
    # Must be Windows: the app targets net8.0-windows and links WinRT capture/OCR.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        # The integration tests that need the game's master.mdb, and the OCR fixture tests, skip
        # themselves on a runner that has neither. The rest of the suite still gates the release.
        run: dotnet test UmaCompanion.sln --nologo -v q

      - name: Publish
        run: >
          dotnet publish src/UmaCompanion.App/UmaCompanion.App.csproj
          -p:PublishProfile=win-x64
          -o artifacts/win-x64
          --nologo

      - name: Zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/v?', '' } else { 'dev' }
          $zip = "artifacts/UmaCompanion-$version-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath $zip
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmaCompanion-win-x64
          path: ${{ env.ZIP }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
